name: Release

# Push a tag like v1.2.3 (matching shadebreak.__version__) to publish:
#   - a GitHub release with notes from CHANGELOG.md,
#   - the Python wheel and sdist, sample heat plans (EN/ES) and SHA-256 checksums,
#   - Docker images ghcr.io/<owner>/shadebreak:1.2.3, :1.2, :1, :latest and :build-<run>.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Tag matches shadebreak.__version__ and CHANGELOG.md
        run: python scripts/release.py check-tag "${GITHUB_REF_NAME}"
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  ci:
    name: CI
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write

  artifacts:
    name: Build release artifacts
    needs: [verify, ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: System libraries for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Build sdist and wheel
        run: |
          python manage.py compilemessages --ignore=.venv
          python -m build
      - name: Render sample heat plans
        run: python scripts/sample_plan.py --out dist
      - name: Release notes and checksums
        run: |
          {
            python scripts/release.py notes "${{ needs.verify.outputs.version }}"
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/${{ github.repository_owner }}/shadebreak:${{ needs.verify.outputs.version }}"
            echo '```'
            echo
            echo "Build ${{ github.run_number }} · commit ${GITHUB_SHA::7}"
          } > release-notes.md
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/
            release-notes.md

  docker:
    name: Publish Docker image
    needs: [verify, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/shadebreak
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=build-${{ github.run_number }}
          flavor: |
            latest=${{ needs.verify.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_NUMBER=${{ github.run_number }}
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: GitHub release
    needs: [verify, artifacts, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
      - uses: softprops/action-gh-release@v2
        with:
          name: Shadebreak ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify.outputs.prerelease == 'false' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.pdf
            dist/SHA256SUMS.txt
