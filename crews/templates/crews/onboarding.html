{% extends "base.html" %}{% load i18n %}
{% block title %}{% translate "Set up your crew" %}{% endblock %}
{% block content %}
<div class="auth" style="max-width:560px">
  <h1>{% translate "Set up your crew" %}</h1>
  <form method="post" class="card form">{% csrf_token %}
    {% for field in form %}{% include "shadebreak/_field.html" %}{% endfor %}
    <button class="btn btn--primary" type="submit">{% translate "Continue" %}</button>
  </form>
</div>
{% endblock %}
