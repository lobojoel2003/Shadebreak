[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shadebreak"
dynamic = ["version"]
description = "Heat-illness prevention for small outdoor crews: NWS forecasts, WBGT, scheduled breaks, acclimatization, buddy check-ins by SMS and a printable heat plan."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Joel Stain Lobo" }]
requires-python = ">=3.12"
keywords = ["heat illness", "WBGT", "occupational safety", "django", "weather.gov", "sms"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Other Audience",
  "Natural Language :: English",
  "Natural Language :: Spanish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
  "Django>=5.2,<5.3",
  "celery[redis]>=5.4,<6",
  "dj-database-url>=2.2",
  "django-htmx>=1.19",
  "gunicorn>=23",
  "numpy>=2.0",
  "psycopg[binary]>=3.2",
  "requests>=2.32",
  "thermofeel>=2.3,<3",
  "weasyprint>=62",
  "whitenoise>=6.7",
]

[project.optional-dependencies]
dev = [
  "freezegun>=1.5",
  "pytest>=8.3",
  "pytest-cov>=5",
  "pytest-django>=4.9",
  "responses>=0.25",
  "ruff>=0.8",
]

[project.urls]
Homepage = "https://github.com/lobojoel2003/shadebreak"
Changelog = "https://github.com/lobojoel2003/shadebreak/blob/main/CHANGELOG.md"
Issues = "https://github.com/lobojoel2003/shadebreak/issues"

[tool.setuptools.dynamic]
version = { attr = "shadebreak.__version__" }

[tool.setuptools.packages.find]
include = ["shadebreak*", "heat*", "nws*", "crews*", "messaging*"]

[tool.setuptools.package-data]
"*" = ["templates/**/*", "static/**/*", "locale/**/*", "fixtures/*.json"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "shadebreak.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:celery.*", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
branch = true
source = ["shadebreak", "heat", "nws", "crews", "messaging"]
omit = ["*/migrations/*", "shadebreak/wsgi.py", "shadebreak/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]
"scripts/*" = ["S105", "S106", "S603", "S607"]
